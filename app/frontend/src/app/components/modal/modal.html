@if (isOpen) {
<div
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
  (click)="onBackdropClick($event)"
>
  <div
    class="bg-white rounded-lg shadow-xl max-w-md w-full transform transition-all animate-modal-enter"
  >
    @if (title) {
    <div class="border-b border-gray-200 px-6 py-4">
      <h2 class="text-xl font-bold text-main-blue">{{ title }}</h2>
    </div>
    }

    <div class="px-6 py-4">
      <ng-content></ng-content>
    </div>

    @if (showActions) {
    <div class="border-t border-gray-200 px-6 py-4 flex gap-3 justify-end">
      <button
        class="px-4 py-2 rounded-lg text-white font-medium transition-colors duration-300 {{ cancelButtonClass }}"
        (click)="onCancel()"
      >
        {{ cancelText }}
      </button>
      <button
        class="px-4 py-2 rounded-lg text-white font-medium transition-colors duration-300 {{ confirmButtonClass }}"
        (click)="onConfirm()"
      >
        {{ confirmText }}
      </button>
    </div>
    }
  </div>
</div>
}
