<div class="w-full flex justify-center">
  <div
    class="w-1/2 p-5 my-12 w-[80%] mx-auto border border-gray-300 rounded-md shadow-md text-center flex flex-col items-center md:w-[90%] md:p-2.5 lg:w-1/3"
  >
    <div class="text-center mb-5 text-3xl md:text-xl text-white font-semibold">
      <h2>Login</h2>
    </div>
    <button
      type="submit"
      [disabled]="loginForm().invalid"
      (click)="login()"
      class="w-4/5 mt-4 p-2 bg-main-blue text-white border-0 rounded-md cursor-pointer transition-colors hover:bg-main-blue-hover disabled:opacity-50 disabled:cursor-not-allowed lg:w-sm"
    >
      {{ buttonText() }}
    </button>
    <p class="mt-4 text-white">
      Don't have an account?
      <a routerLink="/register" class="text-main-blue hover:underline">Sign Up</a>
    </p>
  </div>
</div>
