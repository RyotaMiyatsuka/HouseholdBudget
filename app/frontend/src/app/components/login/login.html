<div class="login-board">
  <div class="login-board__header">
    <h2 class="login-board__title">Login</h2>
  </div>
  <button
    type="submit"
    [disabled]="loginForm().invalid"
    (click)="login()"
    class="login-board__button"
  >
    {{ buttonText() }}
  </button>
  <p class="login-board__footer">
    Don't have an account?<a routerLink="/register" class="login-board__link">Sign Up</a>
  </p>
</div>
