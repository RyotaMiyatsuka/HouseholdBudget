<div class="p-4 flex flex-col items-center justify-center">
  <h1 class="text-white text-2xl font-bold mb-6">設定</h1>
  <button
    class="w-4/5 h-12 px-5 py-2.5 text-sm font-medium text-white rounded-lg bg-main-blue hover:bg-main-blue-hover focus:outline-none focus:ring-1 focus:ring-blue-300 transition-colors lg:w-sm"
    (click)="logout()"
  >
    ログアウト
  </button>
  <div class="w-full mt-8 flex flex-col items-center">
    <h2 class="text-white text-xl font-bold mb-4">登録済みのカテゴリ</h2>
    <ul class="w-4/5 divide-y divide-gray-200 dark:divide-gray-700">
      @for(category of categories(); track category.categoryId) {
      <li class="py-3 sm:py-4">
        <div class="flex items-center space-x-4 rtl:space-x-reverse">
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 truncate dark:text-white">
              {{ category.categoryName }}
            </p>
          </div>
          <div>
            <button
              class="text-red-600 hover:text-red-800 focus:outline-none"
              (click)="deleteCategory(category.categoryId)"
            >
              削除
            </button>
          </div>
        </div>
      </li>
      }
    </ul>
  </div>
</div>
