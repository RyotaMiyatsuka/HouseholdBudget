<p>入力</p>
<div class="input__container">
  <input class="mainForm" type="number" [formControl]="inputControl" />
  <div class="genres">
    @for(genre of genres; track genre) { @if(genre === '+') {
    <button class="plus-button">+</button>
    } @else {
    <button class="genre-button">{{ genre }}</button>
    } }
  </div>
  <button class="submit-button" (click)="register()">登録</button>
</div>
