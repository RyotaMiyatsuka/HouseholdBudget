<div class="md:hidden">
  <p class="text-2xl font-bold text-center mt-5 text-main-blue">入力</p>
  <div class="flex flex-col items-center gap-2.5 mt-5">
    <input
      class="w-[90%] bg-blue-50 text-lg p-2.5 border-2 border-main-blue rounded-lg box-border placeholder:text-main-blue placeholder:opacity-70"
      type="number"
      [formControl]="inputControl"
      placeholder="支出を入力してください"
    />
    <div class="grid grid-cols-4 gap-2.5 w-[90%] py-4">
      @for(genre of genres(); track i; let i = $index) { @if(genre === '+') {
      <button
        class="border-0 rounded-lg bg-teal-500 cursor-pointer transition-colors duration-300 aspect-square flex items-center justify-center p-0 hover:bg-main-blue-hover"
      >
        <img
          class="invert bg-transparent w-3/5 h-3/5 object-contain"
          src="plus-icon.png"
          alt="plus-icon"
        />
      </button>
      } @else {
      <button
        [class]="
          i === selectedGenreIndex()
            ? 'bg-main-blue border-solid border-3 border-white rounded-lg text-white text-lg cursor-pointer transition-colors duration-300 aspect-square'
            : 'bg-main-green border-0 rounded-lg text-white text-lg cursor-pointer transition-colors duration-300 aspect-square hover:bg-main-green-hover'
        "
        (click)="selectGenre(i)"
      >
        {{ genre }}
      </button>
      } }
    </div>
    <button
      class="bg-main-blue border-0 rounded-lg text-white px-5 py-2.5 text-lg w-[90%] h-12 cursor-pointer transition-colors duration-300 hover:bg-main-blue-hover"
      (click)="register()"
    >
      登録
    </button>
  </div>
</div>
