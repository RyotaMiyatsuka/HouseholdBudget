description: 認証失敗
content:
  application/json:
    schema:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type:
            - object
            - "null"
    example:
      code: "Unauthorized"
      message: "Unauthorized access."
      errors: null
