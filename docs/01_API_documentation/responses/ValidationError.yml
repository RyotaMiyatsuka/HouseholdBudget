description: バリデーションエラー
content:
  application/json:
    schema:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type:
            - object
            - "null"
          additionalProperties:
            type: array
            items:
              type: string
    example:
      code: "ValidationError"
      message: "One or more validation errors occurred."
      errors:
        email: ["Email is required."]
